services:
  - type: web
    name: nexus-iot
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run.py"
    plan: free
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: NEXUS_ADMIN_EMAIL
        value: admin@nexus.local
      - key: NEXUS_ADMIN_PASSWORD
        value: PankajAdmin2026!x
